<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de monitoreo | RadarTech</title><link rel="stylesheet" href="../../estilos/sitio.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="../principal.html"><img src="../../img/logo sin fondo.png" alt="RadarTech"><img class="wordmark" src="../../img/nombre marca sin fondo.png" alt="RadarTech"></a><nav class="main-nav"><a href="../principal.html">Inicio</a><a href="../Productos.html">Catálogo</a><a href="../quienes_somos.html">Quiénes somos</a></nav></div></header><main class="dashboard"><div class="container"><div class="eyebrow">RadarTech / Panel</div><h1 class="page-title">Monitoreo en tiempo real</h1><p class="catalog-note">Lecturas recibidas desde la estación meteorológica conectada.</p><div class="dashboard-grid"><article class="metric"><span>Temperatura</span><strong id="dato-temp">-- °C</strong></article><article class="metric"><span>Humedad</span><strong id="dato-hum">-- %</strong></article><article class="metric"><span>Iluminación</span><strong id="dato-luz">-- lx</strong></article></div><p class="status" id="estado">Intentando conectar con la estación local…</p><a class="text-link" href="../principal.html">← Volver al inicio</a></div></main><script>const urlEstacion="http://192.168.4.1/";const estado=document.getElementById("estado");async function actualizarDatos(){try{const respuesta=await fetch(urlEstacion);if(!respuesta.ok)throw new Error("Respuesta HTTP "+respuesta.status);const datos=await respuesta.json();document.getElementById("dato-temp").textContent=(datos.temperatura??"--")+" °C";document.getElementById("dato-hum").textContent=(datos.humedad??"--")+" %";document.getElementById("dato-luz").textContent=(datos.luz??"--")+" lx";estado.textContent="Conectado · última actualización: "+new Date().toLocaleTimeString("es-AR");}catch(error){estado.textContent="Sin conexión con la estación. Verificá que estés conectado a su red Wi-Fi.";}}actualizarDatos();setInterval(actualizarDatos,3000);</script></body></html>
